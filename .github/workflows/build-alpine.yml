name: Build and Deploy Alpine Repository

on:
  push:
    branches:
      - alpine
  schedule:
    # Run weekly to check for updates (Sunday midnight UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      soft_serve_version:
        description: 'Specific soft-serve version to fetch (e.g., 0.12.2). Leave blank for latest.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-alpine-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK Packages inside Alpine Container
        env:
          SOFTSERVE_VERSION: ${{ github.event.inputs.soft_serve_version }}
        run: |
          docker run --rm \
            -e SOFTSERVE_VERSION="$SOFTSERVE_VERSION" \
            -v $(pwd):/workspace -w /workspace \
            alpine:latest sh build-alpine.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
