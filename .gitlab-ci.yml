stages:
  - build
  - publish

variables:
  PROJECT_ID: $CI_PROJECT_ID

build-debian-packages:
  stage: build
  image: debian:trixie
  script:
    - apt-get update && apt-get install -y curl ca-certificates jq
    - mkdir -p debs/
    # Fetch umu-launcher upstream Debian release
    - UMU_VER=$(curl -s "https://api.github.com/repos/Open-Wine-Components/umu-launcher/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
    - curl -fL "https://github.com/Open-Wine-Components/umu-launcher/releases/download/${UMU_VER}/umu-launcher_${UMU_VER}-1_all_debian-13.deb" -o "debs/umu-launcher_${UMU_VER}-1_all_debian-13.deb" || true
    # Fetch ES-DE upstream Debian release
    - ESDE_TAG=$(curl -s "https://gitlab.com/api/v4/projects/es-de%2Femulationstation-de/releases" | grep '"tag_name":' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
    - curl -fL "https://gitlab.com/es-de/emulationstation-de/-/releases/${ESDE_TAG}/downloads/es-de_${ESDE_TAG}-x64.deb" -o "debs/es-de_${ESDE_TAG}-x64.deb" || true
  artifacts:
    paths:
      - debs/

build-alpine-packages:
  stage: build
  image: alpine:latest
  script:
    - apk add --no-cache alpine-sdk abuild curl tar
    - mkdir -p apks/ APKBUILD_dir
    - abuild-keygen -a -n
    # Create APKBUILD for inertia-meta package
    - |
      cat << 'EOF' > APKBUILD_dir/APKBUILD
      # Maintainer: ilembitov
      pkgname=inertia-meta
      pkgver=1.0.0
      pkgrel=0
      pkgdesc="Inertia repository metadata package for Alpine HTPC"
      url="https://gitlab.com/ilembitov/inertia"
      arch="all"
      license="MIT"
      build() {
        return 0
      }
      package() {
        mkdir -p "$pkgdir/usr/share/doc/$pkgname"
        echo "Inertia Alpine Repository Meta Package" > "$pkgdir/usr/share/doc/$pkgname/README"
      }
      EOF
    - cd APKBUILD_dir && abuild -F checksum && abuild -F -r
    - cp ~/packages/APKBUILD_dir/*/*.apk ../apks/ 2>/dev/null || cp ~/packages/*/*/*.apk ../apks/ 2>/dev/null || true
  artifacts:
    paths:
      - apks/

publish-debian:
  stage: publish
  image: curlimages/curl:latest
  needs:
    - build-debian-packages
  script:
    - |
      for deb in debs/*.deb; do
        if [ -f "$deb" ]; then
          echo "Uploading $deb to GitLab Debian Package Registry..."
          curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$deb" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/debian/$(basename $deb)"
        fi
      done

publish-alpine:
  stage: publish
  image: curlimages/curl:latest
  needs:
    - build-alpine-packages
  script:
    - |
      for apk in apks/*.apk; do
        if [ -f "$apk" ]; then
          echo "Uploading $apk to GitLab Alpine Package Registry..."
          curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$apk" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/alpine/v3.20/main/x86_64/$(basename $apk)"
        fi
      done
